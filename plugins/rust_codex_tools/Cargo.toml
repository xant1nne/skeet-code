[package]
name = "skeet_rust_codex_tools"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust tools plugin for Skeet Code ported from open-source Codex/Claude tools"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
walkdir = "2.4"

